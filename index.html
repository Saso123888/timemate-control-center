<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timemate Control Center Admin V2</title>
<style>
:root{--p:#155d43;--p2:#e8f3ed;--bg:#f5f7f6;--ink:#1d312b;--muted:#718079;--line:#dce5e1;--red:#b42318;--orange:#b54708;--blue:#175cd3}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.loginbox{width:min(430px,100%);padding:28px;box-shadow:0 18px 50px #0001}.brand{font-size:24px;font-weight:950}.ver{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf3f0;color:var(--p);font-size:11px;font-weight:900}.muted{color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--p);color:#fff;font-weight:850;cursor:pointer}.secondary{background:#edf3f0;color:var(--ink)}.danger{background:#fee4e2;color:var(--red)}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#17372e;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;background:transparent;color:#dce9e4;text-align:left;padding:11px;border-radius:9px;font-weight:750;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 22px}.view{padding:22px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:15px}.head h1{margin:0}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,1fr)}.card{padding:16px}.metric strong{font-size:29px;display:block;margin-top:8px}.panel{padding:16px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f0f5f2}.pill{padding:4px 7px;border-radius:99px;font-size:11px;font-weight:900}.ok{background:#dcfce7;color:#166534}.warn{background:#ffedd5;color:#9a3412}.err{background:#fee2e2;color:#991b1b}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.toolbar .field{min-width:150px;margin:0}.section{font-weight:900;color:var(--p);margin:18px 0 8px}.note{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:12px}@media(max-width:900px){.app{grid-template-columns:72px 1fr}.side .txt,.side .brand span{display:none}.nav button{text-align:center;font-size:20px}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:600px){.metrics,.formgrid{grid-template-columns:1fr}.view{padding:13px}}
</style>
</head>
<body>
<section id="loginPage" class="login"><form id="loginForm" class="loginbox"><div class="brand">Timemate Control Center Admin <span class="ver">V2</span></div><p class="muted">Lastniški portal za podjetja, instalacije, licence in Emergency Access.</p><div class="field"><label>Uporabniško ime</label><input id="user" value="admin" required></div><div class="field"><label>Geslo</label><input id="pass" type="password" value="admin1234" required></div><div id="loginMsg"></div><button class="btn" style="width:100%">Prijava</button><p class="muted" style="margin-top:12px;text-align:center">Začasna prijava: <b>admin</b> / <b>admin1234</b></p><p class="muted">V1 je začetni prototip. Prijava bo po povezavi z ločenim Supabase projektom prešla na Supabase Auth.</p></form></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand">Timemate <span class="txt">Control Center Admin</span> <span class="ver">V2</span></div><nav class="nav"><button data-page="dashboard">▦ <span class="txt">Nadzorna plošča</span></button><button data-page="companies">▣ <span class="txt">Podjetja</span></button><button data-page="installations">▤ <span class="txt">Instalacije</span></button><button data-page="licenses">◆ <span class="txt">Licence</span></button><button data-page="emergency">◉ <span class="txt">Emergency Access</span></button><button data-page="versions">↻ <span class="txt">Verzije</span></button><button data-page="backup">▥ <span class="txt">Backup</span></button><button data-page="health">♥ <span class="txt">System Health</span></button><button data-page="audit">◎ <span class="txt">Sledljivost</span></button><button data-page="settings">⚙ <span class="txt">Nastavitve</span></button></nav></aside><main class="main"><header class="top"><b id="title">Nadzorna plošča · V1</b><button id="logout" class="btn secondary">Odjava</button></header><div id="view" class="view"></div></main></section>
<script>
const DEMO={companies:[{id:'TM-SI-000001',name:'MACO d.o.o.',package:'POWER',status:'ACTIVE',valid_to:'2027-12-31',users:5,locations:1,version:'2.0',last_seen:'09.11.2026 22:58',emergency:false},{id:'TM-SI-000002',name:'Demo LIGHT d.o.o.',package:'LIGHT',status:'TRIAL',valid_to:'2026-12-09',users:12,locations:1,version:'1.9',last_seen:'09.11.2026 22:41',emergency:false},{id:'TM-SI-000003',name:'Demo POWER d.o.o.',package:'POWER',status:'EXPIRING',valid_to:'2026-11-25',users:42,locations:3,version:'1.8',last_seen:'09.11.2026 21:55',emergency:true}]};const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(v){let c=v==='ACTIVE'?'ok':v==='TRIAL'||v==='EXPIRING'?'warn':'err';return `<span class="pill ${c}">${esc(v)}</span>`}function show(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let names={dashboard:'Nadzorna plošča',companies:'Podjetja',installations:'Instalacije',licenses:'Licence',emergency:'Emergency Access',versions:'Verzije in nadgradnje',backup:'Backup',health:'System Health',audit:'Sledljivost',settings:'Nastavitve'};$('title').textContent=(names[p]||p)+' · V2';({dashboard,companies,installations,licenses,emergency,versions,backup,health,audit,settings}[p]||dashboard)()}
function dashboard(){let c=DEMO.companies;$('view').innerHTML=`<div class="head"><div><h1>Timemate Control Center Admin <span class="ver">V2</span></h1><p class="muted">Centralni pregled Timemate ekosistema</p></div></div><div class="grid metrics"><div class="card metric"><span>Podjetja</span><strong>${c.length}</strong></div><div class="card metric"><span>Aktivne licence</span><strong>${c.filter(x=>x.status==='ACTIVE').length}</strong></div><div class="card metric"><span>POWER</span><strong>${c.filter(x=>x.package==='POWER').length}</strong></div><div class="card metric"><span>Emergency aktiven</span><strong>${c.filter(x=>x.emergency).length}</strong></div></div><div class="panel"><h3>Pregled instalacij</h3>${companyTable(c)}</div><div class="note">V1 uporablja predstavitvene podatke. Naslednji korak je ločen Supabase projekt timemate-control-center in povezava pravih tabel.</div>`}
function companyTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Instance ID</th><th>Podjetje</th><th>Paket</th><th>Status</th><th>Velja do</th><th>Uporabniki</th><th>Poslovalnice</th><th>Verzija</th><th>Zadnji kontakt</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.id}</td><td><b>${esc(x.name)}</b></td><td>${x.package}</td><td>${badge(x.status)}</td><td>${x.valid_to}</td><td>${x.users}</td><td>${x.locations}</td><td>${x.version}</td><td>${x.last_seen}</td></tr>`).join('')}</tbody></table></div>`}
function companies(){$('view').innerHTML=`<div class="head"><div><h1>Podjetja</h1><p class="muted">Centralni register strank.</p></div><button class="btn">＋ Novo podjetje</button></div>${companyTable(DEMO.companies)}`}
function installations(){$('view').innerHTML=`<div class="head"><div><h1>Instalacije</h1><p class="muted">Instance ID, produkt, verzija in zadnji heartbeat.</p></div></div>${companyTable(DEMO.companies)}`}
function licenses(){$('view').innerHTML=`<div class="head"><div><h1>Licence</h1><p class="muted">LIGHT / POWER, veljavnost in omejitve.</p></div></div><div class="panel"><div class="formgrid"><div><h3>LIGHT</h3><p>1 poslovalnica, osnovna registracija Prihod/Odhod, osnovna poročila.</p></div><div><h3>POWER</h3><p>Več poslovalnic, napredne registracije, izmene, GPS, odsotnosti, jeziki in analitika.</p></div></div></div>${companyTable(DEMO.companies)}`}
function emergency(){$('view').innerHTML=`<div class="head"><div><h1>Emergency Access</h1><p class="muted">Časovno omejen servisni dostop preko Control Centerja.</p></div></div><div class="panel"><table><thead><tr><th>Podjetje</th><th>Emergency</th><th>Status</th><th>Dostop do</th><th>Akcija</th></tr></thead><tbody>${DEMO.companies.map(x=>`<tr><td>${x.name}</td><td>${x.emergency?'Ustvarjen':'Ni ustvarjen'}</td><td>${x.emergency?'<span class="pill warn">AKTIVEN</span>':'<span class="pill ok">ZAKLENJEN</span>'}</td><td>${x.emergency?'23:45':'-'}</td><td><button class="btn secondary">${x.emergency?'Onemogoči':'Omogoči 60 min'}</button></td></tr>`).join('')}</tbody></table></div><div class="note">Emergency račun bo dejansko upravljan preko varne Control Center Edge Function. Običajni Timemate ADMIN ga ne bo mogel deaktivirati, izbrisati ali mu odvzeti pravic.</div>`}
function versions(){$('view').innerHTML=`<h1>Verzije in nadgradnje</h1><div class="panel">${companyTable(DEMO.companies)}</div>`}function backup(){$('view').innerHTML=`<h1>Backup</h1><div class="panel"><p>Strežniški modul bo dodan kasneje.</p><p><b>NEW → VALIDATE → LATEST_VALID</b></p><p class="muted">Neveljavna ali prazna kopija nikoli ne prepiše zadnje dobre kopije.</p></div>`}function health(){$('view').innerHTML=`<h1>System Health</h1><div class="panel"><table><thead><tr><th>Podjetje</th><th>Database</th><th>Auth</th><th>Storage</th><th>ADMIN</th><th>REG</th></tr></thead><tbody>${DEMO.companies.map(x=>`<tr><td>${x.name}</td>${'<td><span class="pill ok">OK</span></td>'.repeat(5)}</tr>`).join('')}</tbody></table></div>`}function audit(){$('view').innerHTML=`<h1>Control Center sledljivost</h1><div class="panel"><p>Tu bodo: sprememba licence, Emergency aktivacija, reset gesla, sprememba paketa, upgrade in restore.</p></div>`}function settings(){$('view').innerHTML=`<h1>Nastavitve</h1><div class="panel"><div class="formgrid"><div class="field"><label>Ime produkta</label><input value="Timemate"></div><div class="field"><label>Privzeta POWER omejitev poslovalnic</label><input value="10" type="number"></div><div class="field"><label>Emergency privzeto trajanje</label><select><option>15 min</option><option>30 min</option><option selected>60 min</option><option>120 min</option></select></div><div class="field"><label>Heartbeat opozorilo</label><input value="15" type="number"></div></div></div>`}
$('loginForm').onsubmit=e=>{e.preventDefault();if($('user').value==='admin'&&$('pass').value==='admin1234'){$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}else $('loginMsg').innerHTML='<div class="note">Napačno uporabniško ime ali geslo.</div>'};$('logout').onclick=()=>location.reload();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
</script></body></html>
